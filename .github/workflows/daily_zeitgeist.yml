name: Daily Zeitgeist Commissioning

on:
  schedule:
    - cron: "0 2 * * *"
      timezone: "America/New_York"
    # At most two catch-ups; canonical/public freshness is checked before spending.
    - cron: "37 2,3 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      preflight_only:
        description: Read-only owner readiness check without publication or paid calls
        type: boolean
        required: false
        default: false

      studio_footer_action:
        description: Owner-only, provider-free correction of an exact Studio Monograph footer
        type: choice
        options: [none, preview, rehearse, apply]
        default: none
      expected_publication_id:
        description: Exact accepted publication ID for the footer correction
        type: string
        required: false

concurrency:
  group: readme-state-writer
  cancel-in-progress: false
  queue: max

permissions:
  contents: write
  id-token: write

jobs:
  profile-preflight:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.preflight_only == true &&
      github.actor == 'Siyuan-Zhu' &&
      (github.repository == 'Siyuan-Zhu/readme-live-sandbox' || github.repository == 'Siyuan-Zhu/Siyuan-Zhu')
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Check canonical profile and metadata without writes
        env:
          COMMUNITY_GAME_ENABLED: ${{ vars.COMMUNITY_GAME_ENABLED }}
          PULSE_VOTE_SALT: ${{ secrets.PULSE_VOTE_SALT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BFL_API_KEY: ${{ secrets.BFL_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN || secrets.APIFY_API_TOKEN }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN || secrets.APIFY_TOKEN }}
          APIFY_INSTAGRAM_BUILD: ${{ vars.APIFY_INSTAGRAM_BUILD }}
          SPEND_POLICY_SHA256: ${{ vars.SPEND_POLICY_SHA256 }}
          ZEITGEIST_LIVE_LLM: "1"
          ZEITGEIST_LIVE_COLLECT: "1"
          ZEITGEIST_LIVE_UNSPLASH: "1"
          # Owner-approved quality exception expires after this edition; safety remains mandatory.
          ZEITGEIST_BEST_SAFE_PHOTO_DATE: "2026-11-01"
          TARGET_REPO_SLUG: ${{ vars.TARGET_REPO_SLUG || github.repository }}
          STATE_STORE_BACKEND: ${{ vars.STATE_STORE_BACKEND || 'json' }}
          FIRESTORE_COLLECTION_PREFIX: ${{ vars.FIRESTORE_COLLECTION_PREFIX || '' }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || secrets.GOOGLE_CLOUD_PROJECT || secrets.FIRESTORE_PROJECT_ID || 'git-readme-features' }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT || secrets.GCP_PROJECT_ID || secrets.FIRESTORE_PROJECT_ID || 'git-readme-features' }}
          FIRESTORE_PROJECT_ID: ${{ secrets.FIRESTORE_PROJECT_ID || secrets.GCP_PROJECT_ID || 'git-readme-features' }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          FIRESTORE_DATABASE_ID: ${{ vars.FIRESTORE_DATABASE_ID || '(default)' }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: python3 scripts/probe_profile_readiness.py
  studio-footer:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.preflight_only != true &&
      (inputs.studio_footer_action == 'preview' || inputs.studio_footer_action == 'rehearse' || inputs.studio_footer_action == 'apply') &&
      github.actor == 'Siyuan-Zhu' &&
      (github.repository == 'Siyuan-Zhu/readme-live-sandbox' || github.repository == 'Siyuan-Zhu/Siyuan-Zhu')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Correct exact accepted footer without providers
        env:
          FOOTER_ACTION: ${{ inputs.studio_footer_action }}
          EXPECTED_PUBLICATION_ID: ${{ inputs.expected_publication_id }}
          TARGET_REPO_SLUG: ${{ vars.TARGET_REPO_SLUG || github.repository }}
          STATE_STORE_BACKEND: ${{ vars.STATE_STORE_BACKEND || 'json' }}
          FIRESTORE_COLLECTION_PREFIX: ${{ vars.FIRESTORE_COLLECTION_PREFIX || '' }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || secrets.GOOGLE_CLOUD_PROJECT || secrets.FIRESTORE_PROJECT_ID || 'git-readme-features' }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT || secrets.GCP_PROJECT_ID || secrets.FIRESTORE_PROJECT_ID || 'git-readme-features' }}
          FIRESTORE_PROJECT_ID: ${{ secrets.FIRESTORE_PROJECT_ID || secrets.GCP_PROJECT_ID || 'git-readme-features' }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          FIRESTORE_DATABASE_ID: ${{ vars.FIRESTORE_DATABASE_ID || '(default)' }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        shell: python
        run: |
          import os
          import subprocess
          command = ["python3", "scripts/refresh_studio_footer.py", "--expected-publication-id", os.environ["EXPECTED_PUBLICATION_ID"]]
          action = os.environ["FOOTER_ACTION"]
          if action in ("apply", "rehearse"):
              command.append("--" + action)
          subprocess.run(command, check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-footer-${{ github.run_id }}
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
          path: |
            .footer-preview/
            .publication-recovery/*/assets/
            .publication-recovery/*/README.md
            .publication-recovery/*/variants/
            data/publication_reconcile.json
  synthesize-pulse:
    timeout-minutes: 15
    if: >-
      (github.event_name != 'workflow_dispatch' || (inputs.preflight_only != true && (inputs.studio_footer_action == '' || inputs.studio_footer_action == 'none'))) &&
      vars.ZEITGEIST_WRITER_ENABLED == 'true' &&
      (github.event_name != 'schedule' || vars.ZEITGEIST_SCHEDULE_ENABLED == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-ci.lock

      - name: Install Zeitgeist pipeline dependencies
        run: pip install -r requirements.txt

      - name: Run Daily Zeitgeist Pipeline & Rebuild README
        id: digest
        env:
          DAILY_TRIGGER_SCHEDULE: ${{ github.event.schedule }}
          COMMUNITY_GAME_ENABLED: ${{ vars.COMMUNITY_GAME_ENABLED }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BFL_API_KEY: ${{ secrets.BFL_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN || secrets.APIFY_API_TOKEN }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN || secrets.APIFY_TOKEN }}
          APIFY_INSTAGRAM_BUILD: ${{ vars.APIFY_INSTAGRAM_BUILD }}
          SPEND_POLICY_SHA256: ${{ vars.SPEND_POLICY_SHA256 }}
          ZEITGEIST_LIVE_LLM: "1"
          ZEITGEIST_LIVE_COLLECT: "1"
          ZEITGEIST_LIVE_UNSPLASH: "1"
          # Owner-approved quality exception expires after this edition; safety remains mandatory.
          ZEITGEIST_BEST_SAFE_PHOTO_DATE: "2026-11-01"
          TARGET_REPO_SLUG: ${{ vars.TARGET_REPO_SLUG || github.repository }}
          STATE_STORE_BACKEND: ${{ vars.STATE_STORE_BACKEND || 'json' }}
          FIRESTORE_COLLECTION_PREFIX: ${{ vars.FIRESTORE_COLLECTION_PREFIX || '' }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || secrets.GOOGLE_CLOUD_PROJECT || secrets.FIRESTORE_PROJECT_ID || 'git-readme-features' }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT || secrets.GCP_PROJECT_ID || secrets.FIRESTORE_PROJECT_ID || 'git-readme-features' }}
          FIRESTORE_PROJECT_ID: ${{ secrets.FIRESTORE_PROJECT_ID || secrets.GCP_PROJECT_ID || 'git-readme-features' }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          FIRESTORE_DATABASE_ID: ${{ vars.FIRESTORE_DATABASE_ID || '(default)' }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          python3 scripts/check_runtime_configuration.py --daily
          python3 scripts/refresh_daily_digest.py

      - name: Commit and Push with 3-Attempt Rebase Retry
        id: publish
        if: steps.digest.outputs.publish_required == 'true'
        env:
          COMMUNITY_GAME_ENABLED: ${{ vars.COMMUNITY_GAME_ENABLED }}
          STATE_STORE_BACKEND: ${{ vars.STATE_STORE_BACKEND || 'json' }}
          FIRESTORE_COLLECTION_PREFIX: ${{ vars.FIRESTORE_COLLECTION_PREFIX || '' }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || secrets.GOOGLE_CLOUD_PROJECT || secrets.FIRESTORE_PROJECT_ID || 'git-readme-features' }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT || secrets.GCP_PROJECT_ID || secrets.FIRESTORE_PROJECT_ID || 'git-readme-features' }}
          FIRESTORE_PROJECT_ID: ${{ secrets.FIRESTORE_PROJECT_ID || secrets.GCP_PROJECT_ID || 'git-readme-features' }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          FIRESTORE_DATABASE_ID: ${{ vars.FIRESTORE_DATABASE_ID || '(default)' }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          python3 scripts/publish_readme.py --message "chore(pulse): daily zeitgeist synthesis [skip ci]"

      - name: Finalize actual daily and Git publication outcomes
        if: always()
        env:
          DAILY_TRIGGER_SCHEDULE: ${{ github.event.schedule }}
          DAILY_DIGEST_OUTCOME: ${{ steps.digest.outcome }}
          DAILY_PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: python3 scripts/complete_daily_outcome.py

      - name: Preserve daily outcome and any publication recovery assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            .daily-outcomes/attempt.json
            .publication-recovery/*/assets/
            .publication-recovery/*/README.md
            .publication-recovery/*/variants/
            data/publication_reconcile.json
