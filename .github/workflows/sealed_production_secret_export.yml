name: Prepare sealed provider-secret handoff (disabled by default)

on:
  workflow_dispatch:
    inputs:
      confirm_target:
        description: "After production approval, enter Siyuan-Zhu/Siyuan-Zhu"
        type: string
        required: true
        default: ""
      include_unsplash_oauth:
        description: "Also transfer the optional Unsplash app ID and secret key"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: sealed-production-secret-export
  cancel-in-progress: false

jobs:
  seal-only:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Siyuan-Zhu/readme-live-sandbox' &&
      github.event.repository.private == true &&
      vars.PRODUCTION_SECRET_EXPORT_ENABLED == 'true' &&
      vars.PRODUCTION_SECRET_EXPORT_APPROVED_SHA == github.sha &&
      inputs.confirm_target == 'Siyuan-Zhu/Siyuan-Zhu'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject debug mode before any secret injection
        shell: python
        run: |
          import os
          if os.environ.get("RUNNER_DEBUG") == "1":
              raise SystemExit("Secret handoff is unavailable in debug mode.")
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install pinned encryption tools from the official registry
        run: >-
          python -m pip install --index-url https://pypi.org/simple
          --only-binary=:all: --disable-pip-version-check --no-cache-dir --no-input
          PyNaCl==1.6.2 cffi==2.1.1 pycparser==3.12
      - name: Verify offline encryption boundaries with synthetic values only
        run: python -m unittest tests.test_sealed_secret_handoff -q
      - name: Create ciphertext only
        env:
          PRODUCTION_SECRET_EXPORT_ENABLED: ${{ vars.PRODUCTION_SECRET_EXPORT_ENABLED }}
          PRODUCTION_SECRET_EXPORT_TARGET: "Siyuan-Zhu/Siyuan-Zhu"
          PRODUCTION_SECRET_EXPORT_APPROVED_SHA: ${{ vars.PRODUCTION_SECRET_EXPORT_APPROVED_SHA }}
          PRODUCTION_ACTIONS_PUBLIC_KEY: ${{ vars.PRODUCTION_ACTIONS_PUBLIC_KEY }}
          PRODUCTION_ACTIONS_PUBLIC_KEY_ID: ${{ vars.PRODUCTION_ACTIONS_PUBLIC_KEY_ID }}
          PRODUCTION_SECRET_EXPORT_APPROVED_KEY_ID: ${{ vars.PRODUCTION_SECRET_EXPORT_APPROVED_KEY_ID }}
          PRODUCTION_SECRET_EXPORT_APPROVED_PUBLIC_KEY_SHA256: ${{ vars.PRODUCTION_SECRET_EXPORT_APPROVED_PUBLIC_KEY_SHA256 }}
          SECRET_EXPORT_SOURCE_PRIVATE: ${{ github.event.repository.private }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN || secrets.APIFY_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BFL_API_KEY: ${{ secrets.BFL_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          UNSPLASH_APP_ID: ${{ inputs.include_unsplash_oauth && secrets.UNSPLASH_APP_ID || '' }}
          UNSPLASH_SECRET_KEY: ${{ inputs.include_unsplash_oauth && secrets.UNSPLASH_SECRET_KEY || '' }}
          INCLUDE_UNSPLASH_OAUTH: ${{ inputs.include_unsplash_oauth }}
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          os.umask(0o077)
          directory = Path(os.environ["RUNNER_TEMP"]) / "sealed-provider-handoff"
          directory.mkdir(mode=0o700)
          arguments = [sys.executable, "scripts/seal_production_secrets.py", "--output", str(directory / "encrypted-secrets.json")]
          if os.environ.get("INCLUDE_UNSPLASH_OAUTH") == "true":
              arguments += ["--include-secret", "UNSPLASH_APP_ID", "--include-secret", "UNSPLASH_SECRET_KEY"]
          subprocess.run(arguments, check=True)
      - name: Retain only the encrypted handoff for one day
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sealed-provider-secrets-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sealed-provider-handoff/encrypted-secrets.json
          if-no-files-found: error
          retention-days: 1
      - name: Remove runner ciphertext after upload or failure
        if: always()
        shell: python
        run: |
          import os
          from pathlib import Path
          (Path(os.environ["RUNNER_TEMP"]) / "sealed-provider-handoff" / "encrypted-secrets.json").unlink(missing_ok=True)
