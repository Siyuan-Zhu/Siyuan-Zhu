name: Release acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run deterministic acceptance suite
        env:
          STATE_STORE_BACKEND: json
          ZEITGEIST_LIVE_COLLECT: "0"
          ZEITGEIST_LIVE_LLM: "0"
          ZEITGEIST_LIVE_UNSPLASH: "0"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          pytest -q
          git diff --exit-code


      - name: Measure bounded search on legal fixtures without services
        run: python3 scripts/benchmark_game_search.py
