name: Comparison Run

# Owner-dispatched: the comparison arms of the private run on one frozen intake, three naming attempts each.
# Publishes nothing: no commit, no push, no README, no artifact. Its state writes: one private run record per arm
# and repeat, the spend ledger refresh through maintain_spend_control.py --apply, and the spend holds its paid calls
# write. The arm list and the repeat count reach the script only through the environment, and the script checks them
# against its fixed list. The log carries numbers and public model names only.
on:
  workflow_dispatch:
    inputs:
      arms:
        description: "Comma-separated arms from the fixed list"
        type: string
        required: true
        default: "previous,current"
      repeats:
        description: "Naming attempts per arm, 1 to 3"
        type: string
        required: false
        default: "3"

concurrency:
  group: readme-state-writer
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  id-token: write

jobs:
  comparison-run:
    if: >-
      github.actor == 'Siyuan-Zhu' &&
      (github.repository == 'Siyuan-Zhu/readme-live-sandbox' || github.repository == 'Siyuan-Zhu/Siyuan-Zhu')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Comparison arms of the private run
        env:
          ZEITGEIST_REVIEW_HOLD_DATE: "2026-11-05"
          DAILY_TRIGGER_SCHEDULE: ${{ github.event.schedule }}
          COMMUNITY_GAME_ENABLED: ${{ vars.COMMUNITY_GAME_ENABLED }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BFL_API_KEY: ${{ secrets.BFL_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN || secrets.APIFY_API_TOKEN }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN || secrets.APIFY_TOKEN }}
          SPEND_POLICY_SHA256: "6657e657bd261d5a76ffd939d16f0dc1b817e847bfa50a3ce1f39881d102cc96"
          ZEITGEIST_LIVE_LLM: "1"
          ZEITGEIST_LIVE_COLLECT: "1"
          ZEITGEIST_LIVE_UNSPLASH: "1"
          ZEITGEIST_DIRECTOR_MODEL: ${{ vars.ZEITGEIST_DIRECTOR_MODEL || '' }}
          ZEITGEIST_JUDGE_MODEL: ${{ vars.ZEITGEIST_JUDGE_MODEL || '' }}
          ZEITGEIST_EMBEDDING_MODEL: ${{ vars.ZEITGEIST_EMBEDDING_MODEL || '' }}
          ZEITGEIST_UNDERSTANDING_V1: ${{ vars.ZEITGEIST_UNDERSTANDING_V1 || '0' }}
          ZEITGEIST_RUN_RECORD: ${{ vars.ZEITGEIST_RUN_RECORD || '0' }}
          # Owner-approved quality exception expires after this edition; safety remains mandatory.
          ZEITGEIST_BEST_SAFE_PHOTO_DATE: "2026-11-06"
          TARGET_REPO_SLUG: ${{ vars.TARGET_REPO_SLUG || github.repository }}
          STATE_STORE_BACKEND: ${{ vars.STATE_STORE_BACKEND || 'json' }}
          FIRESTORE_COLLECTION_PREFIX: ${{ vars.FIRESTORE_COLLECTION_PREFIX || '' }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || secrets.GOOGLE_CLOUD_PROJECT || secrets.FIRESTORE_PROJECT_ID || 'git-readme-features' }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT || secrets.GCP_PROJECT_ID || secrets.FIRESTORE_PROJECT_ID || 'git-readme-features' }}
          FIRESTORE_PROJECT_ID: ${{ secrets.FIRESTORE_PROJECT_ID || secrets.GCP_PROJECT_ID || 'git-readme-features' }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          FIRESTORE_DATABASE_ID: ${{ vars.FIRESTORE_DATABASE_ID || '(default)' }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          COMPARISON_ARMS: ${{ inputs.arms }}
          COMPARISON_REPEATS: ${{ inputs.repeats }}
        shell: python
        run: |
          import os
          import subprocess
          import sys
          maintenance = [sys.executable, "scripts/maintain_spend_control.py", "--apply", "--private-report", "/tmp/private-spend-maintenance/evidence.json"]
          code = subprocess.run(maintenance).returncode
          if code != 0:
              sys.exit(code)
          command = [sys.executable, "scripts/private_run.py", "--arms", os.environ.get("COMPARISON_ARMS", ""), "--repeats", os.environ.get("COMPARISON_REPEATS", "")]
          sys.exit(subprocess.run(command).returncode)
